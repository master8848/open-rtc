# Version catalog — vidcall Kotlin binding.
# Supply-chain policy (docs/research/mobile-bindings.md §7, CONTRIBUTING.md):
# exact pins only; every artifact published >= 14 days before adoption.
# Adoption date: 2026-08-11 (14-day cutoff 2026-07-28).
[versions]
kotlin = "2.4.10"             # KGP/serialization plugin; published 2026-07-14
agp = "8.13.2"                # Android Gradle Plugin; published 2025-12-11
serializationJson = "1.11.0"  # kotlinx.serialization; published 2026-04-09
okhttp = "5.4.0"              # OkHttp (WebSocket + REST transports); published 2026-06-08
mockwebserver3 = "5.4.0"    # OkHttp's test mock server (transport wire tests only); same release train as okhttp, published 2026-06-08
streamWebrtc = "1.3.10"       # io.getstream:stream-webrtc-android; published 2025-09-11 (verified via repo1.maven.org)
junit = "4.13.2"              # unit tests; published 2021-02-13

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "mockwebserver3" }
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }

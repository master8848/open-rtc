[package]
name = "vidcall-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
tokio-postgres = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "test-util"] }
tower = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }

[features]
default = []
# Real PostgreSQL integration tests + the PostgresStore require a live server
# (VIDCALL_TEST_POSTGRES_URL); everything else runs without it.
pg-tests = []

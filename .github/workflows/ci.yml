# vidcall CI — L0/L1/L2 test matrix
#
# Layers (see docs/testing.md):
#   L0  protocol conformance fixtures (core + every binding)
#   L1  unit + shared adapter suite (every client backend)
#   L2  cross-language integration (swift/dart/kotlin compile+test)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node L0+L1 (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # every backend package runs its own vitest suite (shared adapter tests)
      - name: backend suites
        run: |
          for p in packages/backend-*; do
            (cd "$p" && npm run test --if-present)
          done

  swift:
    name: L2 swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: build
        run: swift build
        working-directory: packages/swift
      - name: test
        run: swift test
        working-directory: packages/swift

  dart:
    name: L2 dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: deps
        run: dart pub get
        working-directory: packages/dart
      - name: analyze
        run: dart analyze
        working-directory: packages/dart
      - name: test
        run: dart test
        working-directory: packages/dart

  kotlin:
    name: L2 kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: gradle test
        run: ./gradlew test --console=plain
        working-directory: packages/kotlin
      - name: upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results
          path: packages/kotlin/**/build/reports/tests/**

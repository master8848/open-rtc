name: ci
# ── DISABLED ── CI disabled during building phase to save resources.
# To re-enable, restore:
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.2" }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:types
      - run: bun run publint
      - run: bun run attw
      - run: bun run size
      - run: |
          for p in packages/backend-*; do
            echo "backend $p"
            (cd "$p" && bun run test || echo "skip $p")
          done
      - run: bun run lint
      - run: bun run verify:budgets
      - run: bun run verify:links
      - run: bun run changeset:dry-run
      - run: bun run check:quality
  swift:
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: cd packages/swift && swift build && swift test
  dart:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: cd packages/dart && dart pub get && dart analyze && dart test
  kotlin:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd packages/kotlin && ./gradlew test

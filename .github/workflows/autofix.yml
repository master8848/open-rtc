name: autofix
on:
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  autofix:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run format || true
      - run: bun run lint -- --fix 2>&1 | head -n 50; echo "autofix stub — wire autofix.ci or peter-evans/create-pull-request when adopted"
